<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Панель администратора{% endblock %}</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    table { border-collapse: collapse; width: 100%; margin: 20px 0; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background-color: #f2f2f2; }
    .actions { margin: 20px 0; }
    .actions a, .actions button { margin-right: 10px; padding: 8px 16px; text-decoration: none; background: #007bff; color: white; border: none; cursor: pointer; }
    .actions a:hover, .actions button:hover { background: #0056b3; }
    nav ul { list-style: none; padding: 0; background: #333; }
    nav ul li { display: inline; }
    nav ul li a { color: white; padding: 14px 20px; display: inline-block; text-decoration: none; }
    nav ul li a:hover { background: #555; }
    .alert { padding: 10px; margin: 10px 0; border-radius: 4px; }
    .alert-success { background: #d4edda; color: #155724; }
    .alert-error { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>
<header>
  <h1>Панель администратора</h1>
  <nav>
    <ul>
      <li><a href="{% url 'admin_panel:product-list' %}">Товары</a></li>
      <li><a href="{% url 'admin_panel:supplier-list' %}">Поставщики</a></li>
      <li><a href="{% url 'admin_panel:sales-list' %}">Продажи</a></li>
      <li><a href="{% url 'store:home' %}">На сайт</a></li>
      <li><a href="{% url 'web_shop:home' %}">Сотрудникам</a></li>
    </ul>
  </nav>
</header>

<hr>

<main>
  {% if messages %}
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }}">{{ message }}</div>
    {% endfor %}
  {% endif %}
  {% block content %}{% endblock %}
</main>

<hr>

<footer>
  <p>Пользователь: <strong>{{ user.username }}</strong> | <a href="{% url 'store:logout' %}">Выйти</a></p>
</footer>
</body>
</html>
