{% extends "store/base.html" %}
{% block title %}Регистрация · Зоомагазин{% endblock %}
{% block content %}
<h1>Регистрация клиента</h1>

<p>Уже есть аккаунт? <a href="{% url 'store:login' %}">Вход</a></p>
{% endblock %}
