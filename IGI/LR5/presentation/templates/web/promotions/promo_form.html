{% extends "web/base.html" %}
{% block title %}Promo form · ZoomShop{% endblock %}
{% block content %}
<h1>{% if object %}Edit promo{% else %}New promo{% endif %}</h1>
<form method="post">{% csrf_token %}
  {{ form.as_p }}
  <p><button type="submit" class="btn">Save</button>
  <a class="btn btn-secondary" href="{% url 'web_shop:promo-list' %}">Cancel</a></p>
</form>
{% endblock %}
