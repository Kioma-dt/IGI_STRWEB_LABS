{% extends "web/base.html" %}
{% block title %}Supplier form · ZoomShop{% endblock %}
{% block content %}
<h1>{% if object %}Edit supplier{% else %}New supplier{% endif %}</h1>
<form method="post">{% csrf_token %}
  {{ form.as_p }}
  <p><button type="submit" class="btn">Save</button>
  <a class="btn btn-secondary" href="{% url 'web_shop:supplier-list' %}">Cancel</a></p>
</form>
{% endblock %}
