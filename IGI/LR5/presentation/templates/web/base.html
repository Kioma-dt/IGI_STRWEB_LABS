<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}ZoomShop staff{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f6f7f9; color: #222; }
    header { background: #1e3a5f; color: #fff; padding: 12px 20px; }
    header a { color: #c8d9ec; margin-right: 12px; text-decoration: none; font-size: 0.9rem; }
    header a:hover { text-decoration: underline; }
    main { padding: 20px; max-width: 1100px; margin: 0 auto; }
    table { width: 100%; border-collapse: collapse; background: #fff; font-size: 0.95rem; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; vertical-align: top; }
    th { background: #eef2f7; }
    .btn { display: inline-block; padding: 6px 12px; background: #1e3a5f; color: #fff !important; border-radius: 4px; text-decoration: none; border: none; cursor: pointer; font-size: 0.9rem; }
    .btn-secondary { background: #5a6d82; }
    .btn-danger { background: #a33; }
    .msg { padding: 10px 14px; margin: 10px 0; border-radius: 4px; list-style: none; }
    .msg.success { background: #d4edda; border: 1px solid #c3e6cb; }
    .msg.error { background: #f8d7da; border: 1px solid #f5c6cb; }
    .msg.warning { background: #fff3cd; border: 1px solid #ffeeba; }
    form.filter { background: #fff; padding: 12px; margin-bottom: 16px; border: 1px solid #ddd; }
    form.filter p { display: inline-block; margin: 4px 12px 4px 0; vertical-align: top; }
    .sort { margin: 8px 0 16px; font-size: 0.9rem; }
    .sort a { margin-right: 10px; }
    dl.detail dt { font-weight: 600; margin-top: 8px; }
    dl.detail dd { margin: 0 0 4px 0; }
    ul.errorlist { color: #a33; }
  </style>
</head>
<body>
<header>
  <strong>Shop staff</strong>
  {% include "web/includes/nav.html" %}
</header>
<main>
  {% include "web/includes/messages.html" %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
