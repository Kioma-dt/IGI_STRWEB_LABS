version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: django_backend
    volumes:
      - .:/app
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./students-fe
      dockerfile: Dockerfile
    container_name: react_frontend
    volumes:
      - ./students-fe:/app
    ports:
      - "3000:3000"
    environment:
    - HOST=0.0.0.0
    depends_on:
      - backend