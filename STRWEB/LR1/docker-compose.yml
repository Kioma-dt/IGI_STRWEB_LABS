services:
  db:
    image: postgres:16-alpine
    container_name: zoomag_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zoomag_db}
      POSTGRES_USER: ${POSTGRES_USER:-zoomag_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zoomag_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zoomag_user} -d ${POSTGRES_DB:-zoomag_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  web:
    build: .
    container_name: zoomag_web
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    networks:
      - app_network
    restart: unless-stopped

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
  static_volume:
  media_volume:
