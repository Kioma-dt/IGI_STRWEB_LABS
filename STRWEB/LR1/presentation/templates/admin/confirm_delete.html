{% extends "admin/base.html" %}
{% block title %}Подтверждение удаления · Панель администратора{% endblock %}
{% block content %}
<h2>Подтверждение удаления</h2>

<div class="alert alert-error">
  <p><strong>Внимание!</strong> Вы действительно хотите удалить этот объект?</p>
  <p>{{ object }}</p>
</div>

<form method="post">
  {% csrf_token %}
  <div class="actions">
    <button type="submit">Да, удалить</button>
    <a href="{{ request.META.HTTP_REFERER|default:'/' }}">Отмена</a>
  </div>
</form>
{% endblock %}
