{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{% block meta_description %}ЗооМаркет — интернет-магазин кормов, игрушек и аксессуаров для собак, кошек, птиц и грызунов в Беларуси.{% endblock %}">
  <meta name="keywords" content="{% block meta_keywords %}зоомагазин, корм для животных, товары для собак, товары для кошек, ЗооМаркет{% endblock %}">
  <link rel="icon" href="{% static 'images/favicon.svg' %}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=Nunito:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
  <link rel="stylesheet" href="{% static 'css/layout.css' %}">
  <link rel="stylesheet" href="{% static 'css/links.css' %}">
  <link rel="stylesheet" href="{% static 'css/forms.css' %}">
  <link rel="stylesheet" href="{% static 'css/content.css' %}">
  <link rel="stylesheet" href="{% static 'css/tables.css' %}">
  <link rel="stylesheet" href="{% static 'css/home.css' %}">
  <link rel="stylesheet" href="{% static 'css/catalog.css' %}">
  <link rel="stylesheet" href="{% static 'css/contacts.css' %}">
  <link rel="stylesheet" href="{% static 'css/about.css' %}">
  <link rel="stylesheet" href="{% static 'css/news.css' %}">
  <link rel="stylesheet" href="{% static 'css/faq.css' %}">
  <link rel="stylesheet" href="{% static 'css/privacy.css' %}">
  <link rel="stylesheet" href="{% static 'css/vacancies.css' %}">
  <link rel="stylesheet" href="{% static 'css/reviews.css' %}">
  <link rel="stylesheet" href="{% static 'css/promos.css' %}">
  <link rel="stylesheet" href="{% static 'css/responsive.css' %}">
  <link rel="stylesheet" href="{% static 'css/animations.css' %}">
  <title>{% block title %}ЗооМаркет{% endblock %}</title>
  {% block extra_head %}{% endblock %}
</head>
<body>
<header id="site-header">
  {% include "store/includes/nav.html" %}
</header>

<main id="site-main">
  {% include "store/includes/messages.html" %}
  {% block content %}{% endblock %}
</main>

<footer id="site-footer">
  {% include "store/includes/footer.html" %}
</footer>
</body>
</html>
